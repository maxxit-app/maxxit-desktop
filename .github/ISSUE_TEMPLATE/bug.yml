name: Bug report
description: Report a reproducible desktop problem
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Report vulnerabilities privately at https://github.com/maxxit-app/maxxit-desktop/security/advisories/new.
        For account, payment, or personal data requests, email contact@maxxit.app.
        Never attach tokens, real session files, emails, private paths, or project descriptions.
  - type: checkboxes
    id: search
    attributes:
      label: Existing reports
      options:
        - label: I searched existing issues and release notes.
          required: true
  - type: input
    id: version
    attributes: { label: Maxxit version, placeholder: "0.1.10" }
    validations: { required: true }
  - type: input
    id: macos
    attributes: { label: macOS version, placeholder: "14.0" }
    validations: { required: true }
  - type: dropdown
    id: architecture
    attributes: { label: Mac architecture, options: [Apple silicon, Intel] }
    validations: { required: true }
  - type: dropdown
    id: channel
    attributes:
      {
        label: Installation,
        options: [DMG, Homebrew, Installer script, Source build],
      }
    validations: { required: true }
  - type: dropdown
    id: provider
    attributes:
      { label: Affected provider, options: [Codex, Claude Code, Both, Neither] }
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes:
      {
        label: Steps to reproduce,
        description: Include relevant CLI versions without personal account information.,
      }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected behavior }
    validations: { required: true }
  - type: textarea
    id: actual
    attributes: { label: Actual behavior }
    validations: { required: true }
  - type: textarea
    id: evidence
    attributes:
      {
        label: Sanitized evidence,
        description: Review diagnostics and screenshots before attaching them. See docs/diagnostics.md.,
      }
