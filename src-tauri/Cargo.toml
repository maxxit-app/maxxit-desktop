[package]
name = "maxxit"
version = "0.1.11"
edition = "2021"
rust-version = "1.94"
license = "MIT"
default-run = "maxxit"

[lib]
name = "maxxit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-dialog = "=2.6.0"
tauri-plugin-updater = "=2.10.1"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
keyring = { version = "3", features = ["apple-native"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
url = "2"
dirs = "6"
tauri-plugin-process = "=2.4.0"
tauri-plugin-notification = "2"
base64 = "=0.22.1"
minisign-verify = "=0.2.5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWindow"] }

[features]
release-tools = []

[[bin]]
name = "verify_updater"
path = "src/bin/verify_updater.rs"
required-features = ["release-tools"]
